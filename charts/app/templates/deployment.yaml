apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "app.name" . }}
  labels:
    {{- include "app.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicas }}
  selector:
    matchLabels:
      {{- include "app.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "app.labels" . | nindent 8 }}
    spec:
      containers:
        - name: {{ include "app.name" . }}
          image: "{{ .Values.image.repository }}:{{ required "values.image.tag is required" .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.port }}
          # TODO(ch06): pass .Values.env to the container as environment variables
          # TODO(ch06): security: run non-root, read-only root filesystem, no privilege escalation,
          #             drop all capabilities, seccomp RuntimeDefault; do not mount the API token
          # TODO(ch06): reliability: resource requests/limits, readiness and liveness probes on /healthz
